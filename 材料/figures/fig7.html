<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>*{margin:0;padding:0} body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff}</style>
</head>
<body>
<svg width="1240" height="720" viewBox="0 0 1240 720" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <text x="620" y="40" text-anchor="middle" font-size="31" font-weight="700" fill="#1e3a5f">知识库双模式检索与多租户隔离</text>

  <!-- 双触发 -->
  <rect x="160" y="70" width="300" height="60" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" filter="url(#sh)"/>
  <text x="310" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">自动注入模式</text>
  <text x="310" y="119" text-anchor="middle" font-size="13" fill="#1d4ed8">每轮回复前自动检索注入</text>

  <rect x="780" y="70" width="300" height="60" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" filter="url(#sh)"/>
  <text x="930" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">自主检索模式</text>
  <text x="930" y="119" text-anchor="middle" font-size="13" fill="#1d4ed8">智能体按需调用只读工具</text>

  <!-- 统一检索入口 -->
  <rect x="470" y="190" width="300" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4" filter="url(#sh)"/>
  <text x="620" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">统一检索入口</text>

  <path d="M310 130 V158 H540 V186" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M930 130 V158 H700 V186" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 单一向量集合 -->
  <rect x="440" y="300" width="360" height="64" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2" filter="url(#sh)"/>
  <text x="620" y="328" text-anchor="middle" font-size="17.5" font-weight="700" fill="#4c1d95">单一向量集合 · 元数据过滤</text>
  <text x="620" y="351" text-anchor="middle" font-size="13" fill="#6d28d9">一套索引 · 属主标记 + 共享标记</text>

  <line x1="620" y1="254" x2="620" y2="296" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 两个视图 -->
  <rect x="140" y="420" width="420" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2" filter="url(#sh)"/>
  <g transform="translate(168,436)">
    <path d="M6 0 a6 6 0 0 1 6 6 v4 h-12 v-4 a6 6 0 0 1 6 -6" fill="none" stroke="#15803d" stroke-width="2.2"/>
    <rect x="0" y="10" width="12" height="10" rx="2" fill="#15803d"/>
  </g>
  <text x="352" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">视图 1 · 本人全部文档</text>
  <text x="352" y="488" text-anchor="middle" font-size="13.5" fill="#15803d">属主级隔离（私有 + 本人公开）</text>

  <rect x="680" y="420" width="420" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.2" filter="url(#sh)"/>
  <text x="890" y="460" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">视图 2 · 全平台公开文档</text>
  <text x="890" y="488" text-anchor="middle" font-size="13.5" fill="#b45309">经属主显式授权后共享</text>

  <path d="M500 364 V392 H350 V416" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M740 364 V392 H890 V416" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 合并输出 -->
  <rect x="360" y="560" width="520" height="64" rx="13" fill="#1e3a5f"/>
  <text x="620" y="598" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">合并去重 → 相似度排序 → 检索结果输出</text>

  <path d="M350 506 V532 H480 V556" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M890 506 V532 H760 V556" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 图例 -->
  <rect x="200" y="652" width="200" height="40" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="677" text-anchor="middle" font-size="14" fill="#15803d">🔒 属主级隔离边界</text>
  <rect x="840" y="652" width="200" height="40" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="940" y="677" text-anchor="middle" font-size="14" fill="#b45309">共享视图</text>
</svg>
</body>
</html>
