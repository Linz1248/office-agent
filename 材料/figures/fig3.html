<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>*{margin:0;padding:0} body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff}</style>
</head>
<body>
<svg width="1400" height="820" viewBox="0 0 1400 820" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e3a5f" flood-opacity="0.12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>

  <text x="700" y="40" text-anchor="middle" font-size="34" font-weight="700" fill="#1e3a5f">系统总体架构 · 四层分层设计</text>

  <!-- 安全边界 -->
  <rect x="46" y="68" width="1134" height="660" rx="18" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="58" y="76" width="200" height="32" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="158" y="98" text-anchor="middle" font-size="15.5" font-weight="700" fill="#991b1b">企业内网 · 数据零出域</text>

  <!-- 表现层 -->
  <rect x="130" y="108" width="980" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <rect x="130" y="108" width="12" height="84" rx="6" fill="#2563eb"/>
  <text x="168" y="141" font-size="22" font-weight="700" fill="#1e3a8a">表现层　交互界面 + 统一网关 :8080</text>
  <text x="168" y="172" font-size="14.5" fill="#1d4ed8">对话式交互 · 流式推送 · 统一路由 · 跨域与鉴权</text>

  <!-- 界面直连折线（网关直接路由到能力层，不经智能体） -->
  <path d="M 130 155 H 88 V 668 H 130" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrB)"/>
  <text transform="rotate(-90 70 420)" x="70" y="420" text-anchor="middle" font-size="13" fill="#2563eb">界面直连：/extract · /compare · /multimodel（不经智能体）</text>

  <!-- 表现层→智能层 -->
  <line x1="620" y1="192" x2="620" y2="236" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="636" y="200" width="150" height="24" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="711" y="217" text-anchor="middle" font-size="12.5" fill="#475569">统一网关路由 /agent</text>

  <!-- 智能层 -->
  <rect x="130" y="240" width="980" height="190" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <rect x="130" y="240" width="12" height="190" rx="6" fill="#7c3aed"/>
  <text x="168" y="272" font-size="22" font-weight="700" fill="#4c1d95">智能层　ReAct 智能体（平台“大脑”）:9093</text>
  <text x="168" y="300" font-size="14.5" fill="#6d28d9">意图理解 · 任务分解 · 多轮推理 · 自动上下文压缩 · 主辅模型分工</text>
  <!-- 四类资产 -->
  <rect x="168" y="318" width="125" height="42" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230.5" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">长期记忆</text>
  <rect x="303" y="318" width="125" height="42" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="365.5" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">个人知识库</text>
  <rect x="438" y="318" width="125" height="42" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500.5" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">会议知识库</text>
  <rect x="573" y="318" width="125" height="42" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="635.5" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">业务技能</text>
  <text x="168" y="392" font-size="15" fill="#6d28d9">用户级四类资产 · 越用越强（本地向量库 / 图数据库存储）</text>
  <!-- 会议待办模块 -->
  <rect x="730" y="312" width="356" height="104" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="908" y="338" text-anchor="middle" font-size="15.5" font-weight="700" fill="#5b21b6">会议待办模块</text>
  <text x="908" y="362" text-anchor="middle" font-size="13.5" fill="#6d28d9">飞书轮询 · 会议分析师子智能体</text>
  <text x="908" y="386" text-anchor="middle" font-size="13.5" fill="#6d28d9">归属判定 · 截止提醒 · 正文独立入库</text>

  <!-- 智能层→工具层 -->
  <line x1="620" y1="430" x2="620" y2="474" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="636" y="438" width="128" height="24" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="700" y="455" text-anchor="middle" font-size="12.5" fill="#475569">MCP 协议调用</text>

  <!-- 工具层 -->
  <rect x="130" y="478" width="980" height="84" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#sh)"/>
  <rect x="130" y="478" width="12" height="84" rx="6" fill="#0d9488"/>
  <text x="168" y="511" font-size="22" font-weight="700" fill="#134e4a">工具层　MCP 标准工具网关（平台“手”）:9091</text>
  <text x="168" y="542" font-size="14.5" fill="#0f766e">能力标准化封装 · 凭证管理 · 结果长度保护 · 认证自动重试 · 直连能力服务</text>

  <!-- 工具层→能力层 -->
  <line x1="620" y1="562" x2="620" y2="606" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="636" y="570" width="112" height="24" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="692" y="587" text-anchor="middle" font-size="12.5" fill="#475569">服务接口调用</text>

  <!-- 能力层 -->
  <rect x="130" y="610" width="980" height="104" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <rect x="130" y="610" width="12" height="104" rx="6" fill="#16a34a"/>
  <text x="168" y="640" font-size="22" font-weight="700" fill="#14532d">能力层　垂直能力服务 + 本地大模型推理引擎</text>
  <rect x="168" y="656" width="170" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="253" y="681" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803d">文档智能抽取 :9090</text>
  <rect x="350" y="656" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="425" y="681" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803d">文档比对 :9900</text>
  <rect x="514" y="656" width="160" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="594" y="681" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803d">多模态检索 :8000</text>
  <rect x="688" y="656" width="404" height="40" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="890" y="681" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">本地大模型推理引擎（内网隔离 · 数据零出域）</text>

  <!-- 飞书开放平台（边界外，唯一外部依赖） -->
  <rect x="1210" y="300" width="170" height="128" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1295" y="332" text-anchor="middle" font-size="15.5" font-weight="700" fill="#334155">飞书开放平台</text>
  <text x="1295" y="358" text-anchor="middle" font-size="13" fill="#475569">用户授权账号</text>
  <text x="1295" y="382" text-anchor="middle" font-size="13" fill="#475569">妙记转写</text>
  <text x="1295" y="406" text-anchor="middle" font-size="13" fill="#475569">智能纪要</text>
  <!-- 纪要拉取箭头（入域方向） -->
  <line x1="1210" y1="364" x2="1078" y2="364" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <text x="1144" y="300" text-anchor="middle" font-size="12.5" fill="#047857">会议纪要拉取</text>
  <text x="1144" y="318" text-anchor="middle" font-size="12.5" fill="#047857">（唯一外部依赖 · 入域）</text>

  <!-- 图例 -->
  <rect x="46" y="744" width="1334" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="76" y1="767" x2="112" y2="767" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="124" y="772" font-size="13.5" fill="#475569">调用链路（自上而下就绪）</text>
  <path d="M 320 767 H 356" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrB)"/>
  <text x="368" y="772" font-size="13.5" fill="#475569">界面直连（网关直接路由能力服务）</text>
  <line x1="680" y1="767" x2="716" y2="767" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <text x="728" y="772" font-size="13.5" fill="#475569">会议纪要拉取（方向入域，企业数据不出内网）</text>
