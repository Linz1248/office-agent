<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap");
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #1e3a5f; }
      .box-title { font-size: 28px; font-weight: 700; }
      .box-subtitle { font-size: 18px; fill: #4a5568; }
      .box-value { font-size: 18px; font-weight: 500; }
      .arrow-label { font-size: 18px; fill: #2f855a; font-weight: 500; }
    </style>
    <!-- 箭头标记 -->
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#3182ce"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#2f855a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#805ad5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#319795"/>
    </marker>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="700" fill="#f7fafc"/>

  <!-- 标题 -->
  <text x="600" y="70" text-anchor="middle" class="title">四大核心创新点协同关系</text>
  <line x1="400" y1="90" x2="800" y2="90" stroke="#3182ce" stroke-width="4" stroke-linecap="round"/>

  <!-- 安全底座（底部） -->
  <rect x="150" y="530" width="900" height="120" rx="20" ry="20" fill="#c6f6d5" stroke="#22543d" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="585" text-anchor="middle" class="box-title" fill="#22543d">全栈本地化的安全接入底座</text>
  <text x="600" y="620" text-anchor="middle" class="box-value" fill="#276749">价值主张：保障数据主权 · 数据零出域</text>

  <!-- 知识库与技能平台（左侧） -->
  <rect x="50" y="220" width="280" height="140" rx="18" ry="18" fill="#e9d8fd" stroke="#553c9a" stroke-width="3" filter="url(#shadow)"/>
  <text x="190" y="275" text-anchor="middle" class="box-title" fill="#553c9a">知识库与技能平台</text>
  <text x="190" y="310" text-anchor="middle" class="box-subtitle" fill="#6b46c1">组织资产层</text>
  <text x="190" y="340" text-anchor="middle" class="box-value" fill="#805ad5">价值主张：沉淀组织经验</text>

  <!-- ReAct + MCP 统一对话入口（中间） -->
  <rect x="420" y="220" width="360" height="140" rx="18" ry="18" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="275" text-anchor="middle" class="box-title" fill="#2c5282">ReAct + MCP 统一对话入口</text>
  <text x="600" y="320" text-anchor="middle" class="box-value" fill="#2b6cb0">价值主张：打破工具碎片化 · 对话即入口</text>

  <!-- 图谱式记忆系统（右侧） -->
  <rect x="870" y="220" width="280" height="140" rx="18" ry="18" fill="#b2f5ea" stroke="#285e61" stroke-width="3" filter="url(#shadow)"/>
  <text x="1010" y="275" text-anchor="middle" class="box-title" fill="#285e61">图谱式记忆系统</text>
  <text x="1010" y="310" text-anchor="middle" class="box-subtitle" fill="#319795">个体进化层</text>
  <text x="1010" y="340" text-anchor="middle" class="box-value" fill="#2c7a7b">价值主张：越用越懂</text>

  <!-- 箭头：知识库 -> 中枢 -->
  <line x1="330" y1="290" x2="420" y2="290" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- 箭头：中枢 -> 记忆系统 -->
  <line x1="780" y1="290" x2="870" y2="290" stroke="#319795" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- 箭头：底座 -> 中枢（承托） -->
  <line x1="600" y1="530" x2="600" y2="370" stroke="#2f855a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="620" y="460" class="arrow-label">承托</text>

  <!-- 协同关系说明 -->
  <rect x="300" y="130" width="600" height="50" rx="10" ry="10" fill="#ebf8ff" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="600" y="162" text-anchor="middle" font-size="16" fill="#2b6cb0">安全底座保障数据主权 · 统一入口打破工具碎片化 · 知识平台沉淀组织经验 · 记忆系统实现越用越懂</text>

</svg>