<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>*{margin:0;padding:0} body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff}</style>
</head>
<body>
<svg width="1240" height="720" viewBox="0 0 1240 720" style="display:block" xmlns="http://www.w3.org/2000/svg">

  <line x1="930" y1="308" x2="930" y2="376" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrUp)"/>
  <line x1="930" y1="438" x2="930" y2="506" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrUp)"/>

  <text x="952" y="335" font-size="12.5" fill="#7c3aed">1 : N</text>
  <text x="952" y="465" font-size="12.5" fill="#7c3aed">1 : N</text>

  <line x1="1160" y1="560" x2="1160" y2="120" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrUp)"/>
  <text x="1188" y="340" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c3aed" transform="rotate(90 1188 340)">可回溯至原始对话</text>

  <rect x="760" y="610" width="400" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="960" y="634" text-anchor="middle" font-size="14" fill="#475569">每条关系挂载来源陈述</text>
