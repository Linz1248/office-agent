<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>*{margin:0;padding:0} body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff}</style>
</head>
<body>
<svg width="1240" height="620" viewBox="0 0 1240 620" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e3a5f" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 地基（底部） -->
  <rect x="150" y="470" width="940" height="110" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" filter="url(#sh)"/>
  <text x="620" y="516" text-anchor="middle" font-size="30" font-weight="700" fill="#14532d">全栈本地化的安全接入底座</text>
  <text x="620" y="552" text-anchor="middle" font-size="17" fill="#166534">价值主张：保障数据主权 · 数据零出域</text>

  <!-- 中枢 -->
  <rect x="440" y="200" width="360" height="116" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <text x="620" y="242" text-anchor="middle" font-size="27" font-weight="700" fill="#1e3a8a">ReAct + MCP 统一对话入口</text>
  <text x="620" y="280" text-anchor="middle" font-size="16" fill="#1d4ed8">价值主张：打破工具碎片化 · 对话即入口</text>

  <!-- 左翼 -->
  <rect x="60" y="200" width="290" height="116" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#sh)"/>
  <text x="205" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#4c1d95">知识库与技能平台</text>
  <text x="205" y="276" text-anchor="middle" font-size="15" fill="#6d28d9">组织资产层</text>
  <text x="205" y="300" text-anchor="middle" font-size="15" fill="#6d28d9">价值主张：沉淀组织经验</text>

  <!-- 右翼 -->
  <rect x="890" y="200" width="290" height="116" rx="16" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
  <text x="1035" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#134e4a">图谱式记忆系统</text>
  <text x="1035" y="276" text-anchor="middle" font-size="15" fill="#0f766e">个体进化层</text>
  <text x="1035" y="300" text-anchor="middle" font-size="15" fill="#0f766e">价值主张：越用越懂</text>

  <!-- 连线：左翼→中枢 -->
  <line x1="350" y1="258" x2="436" y2="258" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- 连线：中枢→右翼 -->
  <line x1="804" y1="258" x2="886" y2="258" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- 连线：地基→中枢（承托） -->
  <line x1="620" y1="466" x2="620" y2="320" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="636" y="400" font-size="16" fill="#15803d">承托</text>

  <!-- 顶部标题 -->
  <text x="620" y="54" text-anchor="middle" font-size="34" font-weight="700" fill="#1e3a5f">四大核心创新点协同关系</text>
  <line x1="420" y1="78" x2="820" y2="78" stroke="#2563eb" stroke-width="3"/>
</svg>
</body>
</html>
