<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<style>*{margin:0;padding:0} body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff}</style>
</head>
<body>
<svg width="1240" height="640" viewBox="0 0 1240 640" style="display:block" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.13"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>

  <text x="620" y="44" text-anchor="middle" font-size="32" font-weight="700" fill="#1e3a5f">六大核心创新点协同关系</text>
  <line x1="420" y1="66" x2="820" y2="66" stroke="#2563eb" stroke-width="3"/>

  <!-- 创新点二：中枢 -->
  <rect x="450" y="92" width="340" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
  <text x="620" y="122" text-anchor="middle" font-size="14" fill="#1d4ed8">创新点二</text>
  <text x="620" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="#1e3a8a">对话即入口</text>
  <text x="620" y="186" text-anchor="middle" font-size="15" fill="#1d4ed8">ReAct + MCP 统一编排中枢</text>

  <!-- 编排轨 -->
  <path d="M620 204 V 240 H 150 V 272" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/>
  <path d="M620 240 H 440 V 272" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/>
  <path d="M620 240 H 730 V 272" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/>
  <path d="M620 240 H 1020 V 272" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="285" y="230" text-anchor="middle" font-size="14" fill="#c2410c">标准工具调用 · 结果回传</text>

  <!-- 创新点三 -->
  <rect x="25" y="276" width="250" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#sh)"/>
  <text x="150" y="302" text-anchor="middle" font-size="13.5" fill="#6d28d9">创新点三</text>
  <text x="150" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#4c1d95">知识库与技能平台</text>
  <text x="150" y="366" text-anchor="middle" font-size="13.5" fill="#6d28d9">组织资产 · 语义检索 · 技能市场</text>

  <!-- 创新点六 -->
  <rect x="315" y="276" width="250" height="120" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2.5" filter="url(#sh)"/>
  <text x="440" y="302" text-anchor="middle" font-size="13.5" fill="#0e7490">创新点六</text>
  <text x="440" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#155e75">会议待办自动化</text>
  <text x="440" y="366" text-anchor="middle" font-size="13.5" fill="#0e7490">纪要 → 待办 → 提醒 → 沉淀</text>

  <!-- 创新点四 -->
  <rect x="605" y="276" width="250" height="120" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5" filter="url(#sh)"/>
  <text x="730" y="302" text-anchor="middle" font-size="13.5" fill="#0f766e">创新点四</text>
  <text x="730" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#134e4a">图谱式记忆系统</text>
  <text x="730" y="366" text-anchor="middle" font-size="13.5" fill="#0f766e">个体进化 · 用户画像</text>

  <!-- 创新点五 -->
  <rect x="895" y="276" width="250" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" filter="url(#sh)"/>
  <text x="1020" y="302" text-anchor="middle" font-size="13.5" fill="#c2410c">创新点五</text>
  <text x="1020" y="332" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">深度文档智能处理</text>
  <text x="1020" y="366" text-anchor="middle" font-size="13.5" fill="#c2410c">抽取 · 比对 · 跨模态检索</text>

  <!-- 六 → 三：会议正文入库 -->
  <line x1="313" y1="372" x2="281" y2="372" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <text x="297" y="288" text-anchor="middle" font-size="12" fill="#047857">会<tspan x="297" dy="14">议</tspan><tspan x="297" dy="14">正</tspan><tspan x="297" dy="14">文</tspan><tspan x="297" dy="14">入</tspan><tspan x="297" dy="14">库</tspan></text>

  <!-- 六 ↔ 四：画像召回 · 结果沉淀 -->
  <line x1="569" y1="372" x2="601" y2="372" stroke="#059669" stroke-width="2.5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="576" y="294" text-anchor="middle" font-size="12.5" fill="#047857">画<tspan x="576" dy="15">像</tspan><tspan x="576" dy="15">召</tspan><tspan x="576" dy="15">回</tspan></text>
  <text x="594" y="294" text-anchor="middle" font-size="12.5" fill="#047857">结<tspan x="594" dy="15">果</tspan><tspan x="594" dy="15">沉</tspan><tspan x="594" dy="15">淀</tspan></text>

  <!-- 创新点一：底座 -->
  <rect x="25" y="456" width="1120" height="96" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" filter="url(#sh)"/>
  <text x="585" y="486" text-anchor="middle" font-size="14" fill="#166534">创新点一</text>
  <text x="585" y="518" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">全栈本地化安全底座</text>
  <text x="585" y="544" text-anchor="middle" font-size="14" fill="#166534">数据零出域 · 全链路本地推理 · 行为可审计</text>

  <!-- 承托 -->
  <line x1="150" y1="452" x2="150" y2="404" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <line x1="440" y1="452" x2="440" y2="404" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <line x1="730" y1="452" x2="730" y2="404" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <line x1="1020" y1="452" x2="1020" y2="404" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <text x="462" y="434" font-size="13" fill="#2563eb">承托全部能力</text>
  <!-- 一 → 二：全链路本地运行 -->
  <path d="M 1145 480 H 1168 V 148 H 798" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <text x="980" y="138" text-anchor="middle" font-size="13" fill="#2563eb">全链路本地运行</text>

  <!-- 图例 -->
  <rect x="25" y="572" width="1120" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="70" y1="595" x2="110" y2="595" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="122" y="600" font-size="14" fill="#475569">编排与调用</text>
  <line x1="330" y1="595" x2="370" y2="595" stroke="#059669" stroke-width="2.5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="382" y="600" font-size="14" fill="#475569">记忆画像双向回流</text>
  <line x1="610" y1="595" x2="650" y2="595" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <text x="662" y="600" font-size="14" fill="#475569">知识写入</text>
  <line x1="870" y1="595" x2="910" y2="595" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="2 6" marker-end="url(#arrB)"/>
  <text x="922" y="600" font-size="14" fill="#475569">安全底座承托</text>
</svg>
</body>
</html>
